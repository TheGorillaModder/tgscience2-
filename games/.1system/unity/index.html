<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px; color: white;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px; color: black;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var urlParams = new URLSearchParams(window.location.search);
      var gameParam = urlParams.get('game');

      if (!gameParam) {
        unityShowBanner("No game specified in URL query (?game=path/to/folder)", "error");
      }

      var buildUrl = "../../" + gameParam;

      async function fetchAndMergeParts(baseUrl, mimeType) {
        const buffers = [];
        let partIndex = 1;

        let testResponse = await fetch(`${baseUrl}.part0`, { method: 'HEAD' }).catch(() => null);
        if (!testResponse || !testResponse.ok) {
          testResponse = await fetch(`${baseUrl}.part1`, { method: 'HEAD' }).catch(() => null);
          if (testResponse && testResponse.ok) {
            partIndex = 1;
          }
        }

        while (true) {
          const partUrl = `${baseUrl}.part${partIndex}`;
          try {
            const response = await fetch(partUrl);
            if (!response.ok) {
              break;
            }
            const data = await response.arrayBuffer();
            buffers.push(data);
            partIndex++;
          } catch (err) {
            break;
          }
        }

        if (buffers.length === 0) {
          throw new Error(`Failed to load any valid part files for ${baseUrl}`);
        }

        const totalLength = buffers.reduce((sum, buf) => sum + buf.byteLength, 0);
        const combined = new Uint8Array(totalLength);
        let offset = 0;
        for (const buf of buffers) {
          combined.set(new Uint8Array(buf), offset);
          offset += buf.byteLength;
        }

        return new Blob([combined], { type: mimeType });
      }

      loadingBar.style.display = "block";

      async function main() {
        try {
          const [dataBlob, wasmBlob] = await Promise.all([
            fetchAndMergeParts(buildUrl + "/build.data", "application/octet-stream"),
            fetchAndMergeParts(buildUrl + "/build.wasm", "application/wasm")
          ]);

          const dataBlobUrl = URL.createObjectURL(dataBlob);
          const wasmBlobUrl = URL.createObjectURL(wasmBlob);

          var config = {
            dataUrl: dataBlobUrl,
            frameworkUrl: buildUrl + "/build.framework.js",
            codeUrl: wasmBlobUrl,
            loaderUrl: buildUrl + "/unity.loader.js",
            streamingAssetsUrl: buildUrl + "/StreamingAssets",
            companyName: "TG Science",
            productName: gameParam ? gameParam.split('/').pop() : "Unity Game",
            productVersion: "1.0",
            showBanner: unityShowBanner,
          };

          document.title = config.productName;

          var script = document.createElement("script");
          script.src = config.loaderUrl;
          script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
              progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
              loadingBar.style.display = "none";
            }).catch((message) => {
              alert(message);
            });
          };

          document.body.appendChild(script);
        } catch (err) {
          unityShowBanner(err.message, "error");
        }
      }

      main();
    </script>
  </body>
</html>
