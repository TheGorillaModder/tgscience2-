<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player (Legacy Loader)</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background: black;
    }

    #unityContainer {
      width: 100vw;
      height: 100vh;
    }

    #loading-text {
      font-weight: bold;
      font-size: 44px;
      font-family: cursive, sans-serif;
      text-align: center;
      margin-top: 20px;
      position: absolute;
      width: 100%;
      top: 20px;
      z-index: 10;
      background: linear-gradient(
        270deg,
        #ff0000,
        #ff7f00,
        #ffff00,
        #00ff00,
        #0000ff,
        #4b0082,
        #8f00ff
      );
      background-size: 400% 400%;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow 3s ease infinite;
    }

    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>

<body>
  <div id="loading-text">FETCHING DATA (Wait a minute before clicking off)</div>
  <div id="unityContainer"></div>

  <script>
    var loadingText = document.querySelector("#loading-text");

    var urlParams = new URLSearchParams(window.location.search);
    var gameParam = urlParams.get('game');

    if (!gameParam) {
      alert("No game specified in URL query (?game=path/to/folder)");
    }

    var buildUrl = "../../" + gameParam;
    var gameFolderName = gameParam ? gameParam.split('/').pop() : "Unity Game";

    async function fetchAndMergeParts(baseUrl, mimeType) {
      const buffers = [];
      let partIndex = 1;

      let testResponse = await fetch(`${baseUrl}.part0`, { method: 'HEAD' }).catch(() => null);
        if (!testResponse || !testResponse.ok) {
          testResponse = await fetch(`${baseUrl}.part1`, { method: 'HEAD' }).catch(() => null);
          if (testResponse && testResponse.ok) {
            partIndex = 1;
          }
        }

        while (true) {
          const partUrl = `${baseUrl}.part${partIndex}`;
          try {
            const response = await fetch(partUrl);
            if (!response.ok) {
              break;
            }
            const data = await response.arrayBuffer();
            buffers.push(data);
            partIndex++;
          } catch (err) {
            break;
          }
        }

        if (buffers.length === 0) {
          throw new Error(`Failed to load any valid part files for ${baseUrl}`);
        }

        const totalLength = buffers.reduce((sum, buf) => sum + buf.byteLength, 0);
        const combined = new Uint8Array(totalLength);
        let offset = 0;
        for (const buf of buffers) {
          combined.set(new Uint8Array(buf), offset);
          offset += buf.byteLength;
        }

        return new Blob([combined], { type: mimeType });
    }

    function installNetworkInterceptors(redirects) {
      function resolveRedirect(url) {
        const value = typeof url === 'string' ? url : (url && url.url) || String(url || '');
        return redirects.find((item) => value.endsWith(item.name)) || null;
      }

      const originalFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        const match = resolveRedirect(input);
        if (match) {
          return originalFetch(match.url, init);
        }
        return originalFetch(input, init);
      };

      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
        const match = resolveRedirect(url);
        return originalOpen.call(this, method, match ? match.url : url, ...rest);
      };
    }

    function loadLegacyLoaderScript() {
      return new Promise((resolve, reject) => {
        var loaderScript = document.createElement("script");
        loaderScript.src = buildUrl + "/unity.loader.js"; 
        loaderScript.onload = resolve;
        loaderScript.onerror = () => {
          var altScript = document.createElement("script");
          altScript.src = buildUrl + "/UnityLoader.js";
          altScript.onload = resolve;
          altScript.onerror = reject;
          document.head.appendChild(altScript);
        };
        document.head.appendChild(loaderScript);
      });
    }

    (async () => {
      try {
        const [dataBlob, wasmBlob] = await Promise.all([
          fetchAndMergeParts(buildUrl + "/build.data", "application/octet-stream"),
          fetchAndMergeParts(buildUrl + "/build.wasm", "application/wasm")
        ]);

        const dataBlobUrl = URL.createObjectURL(dataBlob);
        const wasmBlobUrl = URL.createObjectURL(wasmBlob);

        installNetworkInterceptors([
          { name: 'build.data', url: dataBlobUrl },
          { name: 'build.wasm', url: wasmBlobUrl }
        ]);

        await loadLegacyLoaderScript();

        var jsonUrl = buildUrl + "/" + gameFolderName + ".json";
        
        let totalBytes = dataBlob.size || 0;
        const totalMB = totalBytes ? (totalBytes / (1024 * 1024)).toFixed(1) : null;

        if (typeof UnityLoader !== "undefined") {
          var unityInstance = UnityLoader.instantiate(
            "unityContainer",
            jsonUrl,
            {
              Module: {
                locateFile: function(url) {
                  if (url.indexOf("build.wasm") !== -1 || url.indexOf(".wasm") !== -1) {
                    return buildUrl + "/build.wasm";
                  }
                  if (url.indexOf("build.framework.js") !== -1) {
                    return buildUrl + "/build.framework.js";
                  }
                  return url;
                }
              },
              onProgress: function(instance, progress) {
                let pct = Math.round(progress * 100);

                if (loadingText) {
                  if (totalMB) {
                    let currentMB = (totalMB * progress).toFixed(1);
                    loadingText.textContent = `LOADING... ${currentMB} MB / ${totalMB} MB (${pct}%)`;
                  } else {
                    loadingText.textContent = `LOADING... ${pct}%`;
                  }

                  if (progress === 1) {
                    loadingText.remove();
                  }
                }
              }
            }
          );
        } else {
          alert("UnityLoader is undefined. Ensure unity.loader.js or UnityLoader.js exists in the game directory.");
        }

      } catch (err) {
        console.error("Failed to load game:", err);
      }
    })();
  </script>
</body>
</html>
