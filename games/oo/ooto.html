der-box; } .btn-border-beam::before { content: ""; position: absolute; top: 50%; left: 50%; width: 350%; height: 350%; z-index: 0; background: conic-gradient( from 0deg, transparent 0deg, transparent 240deg, rgba(255, 255, 255, 0.95) 270deg, var(--secondary-color) 300deg, var(--primary-color) 320deg, transparent 360deg ); animation: border-beam-spin 2.8s linear infinite; transform: translate(-50%, -50%) rotate(0deg); } @keyframes border-beam-spin { to { transform: translate(-50%, -50%) rotate(360deg); } } .btn-play { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; flex: 1 1 auto; width: 100%; min-width: 0; background-color: var(--primary-color); color: white; } .btn-play:hover, .btn-border-beam:hover .btn-play { background-color: #5533dd; box-shadow: 0 12px 30px rgba(104, 66, 255, 0.35); } .btn-trending { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; flex: 1 1 auto; width: 100%; min-width: 0; background-color: white; color: var(--primary-color); border: none; padding: 20px 50px; } .btn-trending:hover, .btn-border-beam:hover .btn-trending { background-color: var(--bg-light); box-shadow: 0 12px 30px rgba(104, 66, 255, 0.1); } .hidden { opacity: 0; visibility: hidden; pointer-events: none; }</style></head><body> <div id="game-container"> <iframe src="https://jasongamesdev.github.io/ovo-2/" title="Ovo 2"></iframe> </div> <div id="game-overlay" class="hidden"> <div class="button-group"> <div class="btn-border-beam"> </div> <div class="btn-border-beam"> </div> </div> </div> <script> document.addEventListener("DOMContentLoaded", () => { const overlay = document.getElementById("game-overlay"); const playBtn = document.getElementById("play-btn"); playBtn.addEventListener("click", () => { overlay.classList.add("hidden"); const gameIframe = document.querySelector("iframe"); if (gameIframe) gameIframe.focus(); }); }); </script></body></html>
