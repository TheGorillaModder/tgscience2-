<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found - Open Forge</title>

    <style>
      :root {
        --bg-dark: #0f1015;
        --card-bg: #1a1c23;
        --accent: #1a73e8;
        --text-main: #ffffff;
        --text-muted: #9aa0a6;
        --border-color: #282a36;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        box-sizing: border-box;
      }

      #message {
        background-color: var(--card-bg);
        max-width: 420px;
        width: 100%;
        padding: 40px 32px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        text-align: center;
        box-sizing: border-box;
      }

      #message h2 {
        color: var(--accent);
        font-weight: 800;
        font-size: 72px;
        margin: 0 0 10px 0;
        letter-spacing: 2px;
        text-shadow: 0 4px 15px rgba(26, 115, 232, 0.3);
      }

      #message h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-main);
        margin: 0 0 16px 0;
      }

      #message p {
        line-height: 150%;
        margin: 0 0 30px 0;
        font-size: 14px;
        color: var(--text-muted);
      }

      #message a {
        display: block;
        text-align: center;
        background-color: var(--accent);
        text-transform: uppercase;
        text-decoration: none;
        color: white;
        padding: 14px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 14px;
        letter-spacing: 0.5px;
        transition: opacity 0.2s, transform 0.1s;
        box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4);
      }

      #message a:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      #message h3 {
        color: var(--text-muted);
        font-weight: normal;
        font-size: 12px;
        margin: 30px 0 8px;
        border-top: 1px solid var(--border-color);
        padding-top: 20px;
      }

      #message code {
        background: #111216;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        color: var(--accent);
      }

      @media (max-width: 480px) {
        body { padding: 16px; }
        #message { padding: 30px 20px; }
      }
    </style>
  </head>
  <body>
    <div id="message">
      <h2>404</h2>
      <h1>Page Not Found</h1>
      <p>The specified file or build was not found. Please check the URL or return to the main dashboard.</p>
      <a href="/">Return to Home</a>
    </div>
  </body>
</html>
